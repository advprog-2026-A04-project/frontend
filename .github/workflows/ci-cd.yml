name: CI/CD

on:
  push:
    branches:
      - main
      - staging
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CLOUD_RUN_REGION: us-central1
  CLOUD_RUN_SERVICE: advprog-frontend-m25-m50

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        env:
          VITE_AUTH_BASE_URL: ${{ secrets.VITE_AUTH_BASE_URL }}
          VITE_INVENTORY_BASE_URL: ${{ secrets.VITE_INVENTORY_BASE_URL }}
          VITE_WALLET_BASE_URL: ${{ secrets.VITE_WALLET_BASE_URL }}
          VITE_ORDER_BASE_URL: ${{ secrets.VITE_ORDER_BASE_URL }}
          VITE_VOUCHER_BASE_URL: ${{ secrets.VITE_VOUCHER_BASE_URL }}
        run: npm run build

      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        if: github.event_name != 'pull_request'
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$CLOUD_RUN_REGION" \
            --allow-unauthenticated \
            --max-instances=3

      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$CLOUD_RUN_REGION" \
            --format='value(status.url)')"
          curl --fail --silent --show-error "$url/status"
